<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Cursor and LUCH: from issue to reviewable patch</title><desc id="d">A bug report is investigated using a selected repository and test server, then a patch is prepared for review.</desc><rect width="1200" height="360" rx="22" fill="#F5F3EA"/><text x="42" y="52" fill="#5F776D" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">CURSOR / FROM ISSUE TO PATCH</text><rect x="36" y="138" width="230" height="160" rx="16" fill="#FFFFFF" stroke="#D8E1D5"/><text x="60" y="174" fill="#5F776D" font-family="Arial" font-size="15" font-weight="700">01 / REPORT</text><text x="60" y="219" fill="#15392F" font-family="Arial" font-size="22" font-weight="700">Bug report</text><text x="60" y="257" fill="#5F776D" font-family="Arial" font-size="16">What failed?</text><path d="M266 218 H313 M300 205 L314 218 L300 231" stroke="#E98065" stroke-width="4" fill="none"/><rect x="330" y="112" width="260" height="210" rx="18" fill="#15392F"/><text x="356" y="153" fill="#E7B6A6" font-family="Arial" font-size="15" font-weight="700">02 / INSPECT</text><text x="356" y="198" fill="#FFFFFF" font-family="Arial" font-size="22" font-weight="700">Repository</text><text x="356" y="236" fill="#FFFFFF" font-family="Arial" font-size="22" font-weight="700">Test server</text><text x="356" y="281" fill="#B9CDC1" font-family="Arial" font-size="16">Selected by you</text><path d="M590 218 H640 M627 205 L641 218 L627 231" stroke="#E98065" stroke-width="4" fill="none"/><rect x="658" y="112" width="260" height="210" rx="18" fill="#FFFFFF" stroke="#D8E1D5"/><text x="684" y="153" fill="#5F776D" font-family="Arial" font-size="15" font-weight="700">03 / PREPARE</text><rect x="684" y="178" width="206" height="18" rx="5" fill="#F2DCD3"/><rect x="684" y="210" width="166" height="18" rx="5" fill="#DCEADF"/><rect x="684" y="242" width="188" height="18" rx="5" fill="#F2DCD3"/><text x="684" y="291" fill="#5F776D" font-family="Arial" font-size="16">Reviewable diff</text><path d="M918 218 H966 M953 205 L967 218 L953 231" stroke="#E98065" stroke-width="4" fill="none"/><rect x="982" y="138" width="182" height="160" rx="16" fill="#E4ECE3" stroke="#D8E1D5"/><text x="1006" y="176" fill="#5F776D" font-family="Arial" font-size="15" font-weight="700">04 / YOU</text><text x="1006" y="220" fill="#15392F" font-family="Arial" font-size="22" font-weight="700">Review</text><text x="1006" y="257" fill="#5F776D" font-family="Arial" font-size="16">Then decide</text><text x="40" y="342" fill="#5F776D" font-family="Arial" font-size="13">A designed workflow · no silent merge or deployment</text></svg>